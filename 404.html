<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — ShowMeAnImage</title>
  <meta name="description" content="The page you're looking for doesn't exist on showmeanimage.com.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image" href="Images/favicon.ico">
<link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    function toggleNav() {
      const l = document.querySelector('.nav-links');
      const btn = document.querySelector('.nav-toggle');
      const open = l.getAttribute('data-open') === 'true';
      l.setAttribute('data-open', open ? 'false' : 'true');
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
    }
  </script>
  <style>
    .error-layout {
      min-height: calc(100vh - 64px - 73px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(48px, 8vw, 96px) clamp(24px, 5vw, 72px);
    }

    .error-code {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 1.5rem;
    }

    .error-title {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 6vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 1.5rem;
    }

    .error-title em { font-style: italic; }

    .error-text {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text-muted);
      font-weight: 300;
      max-width: 420px;
      margin-bottom: 2.5rem;
    }

    .error-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .error-rule {
      width: 32px;
      height: 1px;
      background: var(--hairline);
      margin: 2.5rem 0;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">ShowMeAnImage</a>
  <button class="nav-toggle" onclick="toggleNav()" aria-expanded="false" aria-label="Menu">
    <span class="nav-toggle-line"></span>
    <span class="nav-toggle-line"></span>
    <span class="nav-toggle-line"></span>
  </button>
  <ul class="nav-links" data-open="false">
    <li class="dropdown">
      <a href="portfolio.html">Portfolio<span class="nav-caret" aria-hidden="true"> ▼</span></a>
      <div class="dropdown-content">
        <a href="people.html">People</a>
        <a href="cars.html">Cars</a>
        <a href="architecture.html">Architecture</a>
        <a href="concert.html">Concert</a>
      </div>
    </li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<div class="page-wrapper">
  <div class="error-layout">
    <span class="error-code">Error 404</span>
    <h1 class="error-title">Going<br><em>Somewhere?</em></h1>
    <p class="error-text">Page not found.</p>
    <div class="error-rule"></div>
    <div class="error-actions">
      <a href="index.html" class="btn-dark">Back Home</a>
      <a href="portfolio.html" class="btn-outline">View Portfolio</a>
    </div>
  </div>
</div>

<footer>
  <span class="footer-copy">&copy; 2026 Showmeanimage. All rights reserved.</span>
  <div class="footer-links">
    <a href="privacy.html" class="footer-link">Privacy Policy</a>
  </div>
  <span class="footer-logo">Showmeanimage</span>
</footer>

<script src="skeleton-loader.js" defer></script>
</body>
</html>
