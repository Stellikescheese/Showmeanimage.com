<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture — ShowMeAnImage</title>
  <meta name="description" content="Architectural photography by Melbourne-based photographer STEL — lines, volumes, and geometry shot for shadow and structure.">
  <link rel="icon" type="image" href="Images/favicon.ico">
<link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /*
    ┌─────────────────────────────────────────┐
    │  CAROUSEL SETTINGS — edit here          │
    │                                         │
    │  CAROUSEL_COUNT : max photos to cycle   │
    │    through in the hero carousel.        │
    │    Auto-shrinks if fewer exist.         │
    │                                         │
    │  CAROUSEL_PAUSE : seconds to pause on   │
    │    each photo. Default: 3               │
    │                                         │
    │  CAROUSEL_TRANSITION : seconds for the  │
    │    slide animation. Default: 0.6        │
    └─────────────────────────────────────────┘
    */
    :root {
      --CAROUSEL_COUNT:      4;
      --CAROUSEL_PAUSE:      2.5;
      --CAROUSEL_TRANSITION: 1;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">ShowMeAnImage</a>
  <button class="nav-toggle" onclick="toggleNav()" aria-expanded="false" aria-label="Menu">
    <span class="nav-toggle-line"></span>
    <span class="nav-toggle-line"></span>
    <span class="nav-toggle-line"></span>
  </button>
  <ul class="nav-links" data-open="false">
    <li class="dropdown">
      <a href="portfolio.html">Portfolio<span class="nav-caret" aria-hidden="true"> ▼</span></a>
      <div class="dropdown-content">
        <a href="people.html">People</a>
        <a href="cars.html">Cars</a>
        <a href="architecture.html">Architecture</a>
        <a href="concert.html">Concert</a>
      </div>
    </li>
    <li><a href="about.html">About</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<div class="page-wrapper">

  <!-- ── CAROUSEL ── -->
  <div class="category-hero">
    <div class="carousel-track" id="carouselTrack"></div>
    <button class="carousel-pause-btn" id="carouselPauseBtn" onclick="toggleCarouselPause()" aria-label="Pause slideshow" aria-pressed="false">
      <svg class="icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <rect x="6" y="4" width="4" height="16"></rect>
        <rect x="14" y="4" width="4" height="16"></rect>
      </svg>
      <svg class="icon-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none">
        <polygon points="6,4 20,12 6,20"></polygon>
      </svg>
    </button>
  </div>

  <!-- ── HEADER ── -->
  <div class="category-header">
    <span class="category-subtitle"></span>
    <h1 class="category-title">Architecture</h1>
    <p class="category-desc">Buildings artfully framed.</p>
  </div>

  <!-- ── GALLERY ── -->
  <div class="gallery-grid" id="gallery"></div>

  </div>

<footer>
  <span class="footer-copy">&copy; 2026 ShowMeAnImage. All rights reserved.</span>
  <div class="footer-links">
    <a href="privacy.html" class="footer-link">Privacy Policy</a>
  </div>
  <span class="footer-logo">ShowMeAnImage</span>
</footer>

<!-- ── LIGHTBOX ── -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">&times;</button>
  <button class="lightbox-arrow lightbox-arrow--prev" id="lb-prev" onclick="shiftLightbox(-1)" aria-label="Previous">&#8249;</button>
  <div class="lightbox-img-wrap">
    <img id="lb-img" src="" alt="">
  </div>
  <button class="lightbox-arrow lightbox-arrow--next" id="lb-next" onclick="shiftLightbox(1)" aria-label="Next">&#8250;</button>
  <div class="lightbox-counter" id="lb-counter" aria-live="polite" aria-atomic="true"></div>
</div>

<script>
  function toggleNav() {
      const l = document.querySelector('.nav-links');
      const btn = document.querySelector('.nav-toggle');
      const open = l.getAttribute('data-open') === 'true';
      l.setAttribute('data-open', open ? 'false' : 'true');
      btn.setAttribute('aria-expanded', open ? 'false' : 'true');
    }
</script>
<script src="gallery.js"></script>
<script>
  // ── Curate here ──
  // carousel: list photo numbers in the order you want them in the hero
  //   carousel, e.g. [1, 6, 7, 2, 3, 9]. Leave empty [] to auto-use the
  //   first few in numeric order (count set by --CAROUSEL_COUNT above).
  // order: list photo numbers in the order you want them in the gallery
  //   grid, e.g. [3, 1, 2, 6, 4, 5]. Any photos not listed are added
  //   afterwards in normal numeric order. Leave empty [] for numeric order.
  initCategoryPage('Architecture', {
    carousel: [],
    order: []
  });
</script>

<script src="skeleton-loader.js" defer></script>
</body>
</html>
